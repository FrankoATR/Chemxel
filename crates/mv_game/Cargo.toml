[package]
name = "mv_game"
description = "Chemxel game binary: main loop, input, camera and debug UI."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
default-run = "chemxel"

[[bin]]
name = "chemxel"
path = "src/main.rs"

[features]
# Stream tracing spans to the Tracy profiler (https://github.com/wolfpld/tracy).
profile = ["dep:tracing-tracy"]

[dependencies]
mv_core.workspace = true
mv_materials.workspace = true
mv_world.workspace = true
glam.workspace = true
mv_sim.workspace = true
mv_physics.workspace = true
mv_render.workspace = true
winit.workspace = true
wgpu.workspace = true
egui.workspace = true
egui-wgpu.workspace = true
egui-winit.workspace = true
pollster.workspace = true
anyhow.workspace = true
serde.workspace = true
ron.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tracing-tracy = { workspace = true, optional = true }

[lints]
workspace = true
